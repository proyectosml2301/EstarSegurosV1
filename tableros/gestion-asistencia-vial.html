<title>Tablero Estar Seguros</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Layout: consola de gestión — barra superior fija, menú lateral por dimensiones, una vista a la vez */
:root{
  --bg:#F3F7F6;
  --surface:#FFFFFF;
  --surface-2:#EBF3F2;
  --ink:#1D312E;
  --ink-2:#3A4F4B;
  --muted:#5A7470;
  --line:#D6E3E1;
  --accent:#1E9C9C;
  --accent-2:#7DB31A;
  --accent-soft:#DDF2F1;
  --accent-ink:#127272;
  --on-accent:#FFFFFF;
  --good:#1E7F48; --warn:#A86A12; --bad:#B8322A;
  --good-bg:color-mix(in srgb,var(--good) 12%,transparent);
  --warn-bg:color-mix(in srgb,var(--warn) 14%,transparent);
  --bad-bg:color-mix(in srgb,var(--bad) 12%,transparent);
  --f-display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1615;
  --surface:#11211F;
  --surface-2:#172B29;
  --ink:#E2EFEC;
  --ink-2:#C0D2CE;
  --muted:#8CA6A1;
  --line:#22383A;
  --accent:#3CBABA;
  --accent-2:#9ED13A;
  --accent-soft:#123A3A;
  --accent-ink:#7FDCDC;
  --on-accent:#052222;
  --good:#5CC98A; --warn:#E2B04A; --bad:#F08A7E; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B1615;
  --surface:#11211F;
  --surface-2:#172B29;
  --ink:#E2EFEC;
  --ink-2:#C0D2CE;
  --muted:#8CA6A1;
  --line:#22383A;
  --accent:#3CBABA;
  --accent-2:#9ED13A;
  --accent-soft:#123A3A;
  --accent-ink:#7FDCDC;
  --on-accent:#052222;
  --good:#5CC98A; --warn:#E2B04A; --bad:#F08A7E; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{background:#FFFFFF;border-radius:8px;padding:5px 9px;display:flex;align-items:center;flex:0 0 auto;box-shadow:0 0 0 1px var(--line)}
.logo img{display:block;width:auto;max-width:none}
.prov{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;padding-right:14px;border-right:1px solid var(--line)}
.prov span{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.prov b{font:800 16px/1.1 var(--f-display);color:var(--ink);letter-spacing:-.01em}
.prov img{height:26px;width:auto;margin-top:3px}
.mono{width:38px;height:38px;border-radius:6px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;
  font:800 15px/1 var(--f-display);letter-spacing:.02em;flex:0 0 auto}
.brand{min-width:0}
.brand h1{margin:0;font:700 18px/1.15 var(--f-display);letter-spacing:-.01em}
.brand p{margin:0;color:var(--muted);font-size:12.5px}
.top .ctl{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.field label{font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:10.5px}
select,input[type=search]{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;color:var(--ink);max-width:100%}
select{cursor:pointer}
select:hover,input[type=search]:hover{border-color:var(--accent)}
.navsel{display:none}

/* Estructura */
.shell{display:grid;grid-template-columns:212px minmax(0,1fr);gap:0;min-height:calc(100vh - 60px)}
.side{border-right:1px solid var(--line);padding:18px 10px 18px max(12px,env(safe-area-inset-left,0px));position:sticky;top:61px;align-self:start;height:calc(100vh - 61px);overflow:auto}
.side h6{margin:16px 10px 6px;font:600 10.5px/1 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.side h6:first-child{margin-top:0}
.side button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:8px 10px;cursor:pointer;color:var(--ink-2);font-size:13.5px}
.side button:hover{background:var(--surface-2)}
.side button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.side button .n{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500}
.side .foot{margin:20px 10px 0;font-size:11.5px;color:var(--muted);line-height:1.5}
main{min-width:0;padding-block:22px 60px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
.view{display:flex;flex-direction:column;gap:18px;max-width:1240px}
.vhead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.vhead h2{margin:0;font:700 24px/1.15 var(--f-display);letter-spacing:-.015em;text-wrap:balance}
.vhead p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.vhead .tools{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:none;padding:6px 12px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .lb{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .v{font:700 26px/1.1 var(--f-display);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v small{font:500 13px var(--f-body);color:var(--muted);margin-left:3px;letter-spacing:0}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px}
.kpi canvas{height:30px!important;width:100%!important;margin-top:4px}
.cmp{width:7px;height:7px;transform:rotate(45deg);background:var(--accent);margin-left:auto;flex:0 0 auto;display:inline-block}
.cmpk{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}.cmpk .cmp{margin:0}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap}
.chip.up{color:var(--good);background:var(--good-bg)}.chip.dn{color:var(--bad);background:var(--bad-bg)}.chip.fl{color:var(--muted);background:var(--surface-2)}
.chip.wr{color:var(--warn);background:var(--warn-bg)}
.tip{position:relative;display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;border:1px solid var(--muted);font:italic 700 9px/1 Georgia,serif;cursor:help;text-transform:none;letter-spacing:0}
.tip .bx{position:absolute;bottom:calc(100% + 8px);left:-10px;width:250px;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;
  box-shadow:0 8px 24px rgba(0,0,0,.18);font:400 12px/1.45 var(--f-body);color:var(--ink-2);font-style:normal;display:none;max-width:calc(100vw - 32px)}
.tip .bx code{display:block;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font:500 11px/1.4 ui-monospace,'SF Mono',Menlo,monospace;color:var(--accent-ink)}
.tip:hover .bx,.tip:focus .bx{display:block}

/* Paneles */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid32{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel h3{margin:0;font:600 15px/1.3 var(--f-display)}
.panel .ph{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.panel .ph p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.panel .ph .tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.ch{position:relative;height:300px}
.ch.sm{height:220px}
.read{overflow-wrap:anywhere;font-size:13px;color:var(--ink-2);line-height:1.6;margin:10px 0 0;max-width:72ch}
.read b{color:var(--ink)}
.note{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;margin-top:12px;line-height:1.55}

/* Insights */
.ins{display:flex;flex-direction:column}
.ins article{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.ins article:first-child{border-top:0;padding-top:4px}
.sev{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;justify-self:start}
.sev.high{color:var(--bad);background:var(--bad-bg)}.sev.med{color:var(--warn);background:var(--warn-bg)}.sev.ok{color:var(--good);background:var(--good-bg)}
.ins h4{margin:0 0 3px;font:600 14.5px/1.35 var(--f-display)}
.ins p{margin:0;color:var(--ink-2);font-size:13px;max-width:78ch}
.ins .act{margin-top:6px;font-size:12.5px;color:var(--ink)}
.ins .act b{color:var(--accent-ink)}
.go{background:none;border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--accent-ink);white-space:nowrap}
.go:hover{border-color:var(--accent)}

/* Tablas */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:var(--surface-2);text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px;white-space:nowrap;position:sticky;top:0}
th.sort{cursor:pointer}th.sort:hover{color:var(--ink)}
td{padding:7px 10px;border-top:1px solid var(--line);white-space:nowrap}
td.num,th.num{text-align:right}
tr:hover td{background:var(--surface-2)}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:4px;font-weight:600}
.pill.high{color:var(--bad);background:var(--bad-bg)}.pill.med{color:var(--warn);background:var(--warn-bg)}.pill.ok{color:var(--good);background:var(--good-bg)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.pager button,.btn{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12px}
.pager button:disabled{opacity:.4;cursor:default}
.btn:hover{border-color:var(--accent)}

/* Flujo conciliación */
.flow{display:flex;flex-direction:column;gap:12px}
.flow .fl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:center}
.flow .fl span{font-size:12px;color:var(--muted)}
.flow .fl span b{display:block;color:var(--ink);font:700 15px var(--f-display)}
.stack{display:flex;height:30px;border-radius:5px;overflow:hidden;font-size:11.5px;font-weight:600}
.stack div{display:flex;align-items:center;padding:0 8px;white-space:nowrap;overflow:hidden;color:var(--on-accent)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.def dl{display:grid;grid-template-columns:200px minmax(0,1fr);gap:0;margin:0}
.def dt,.def dd{padding:10px 0;border-top:1px solid var(--line);margin:0}
.def dt{font-weight:600}
.def dd code{font:500 12px ui-monospace,Menlo,monospace;color:var(--accent-ink);background:var(--surface-2);padding:1px 5px;border-radius:4px}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:40}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.grid32{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .navsel{display:flex}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .ins article{grid-template-columns:minmax(0,1fr)}
  .def dl{grid-template-columns:minmax(0,1fr)}.def dd{border-top:0;padding-top:0}
  .flow .fl{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){.top{position:static}}
@media (max-width:640px){.prov{align-items:flex-start;border-right:0;padding-right:0;width:100%}}
@media (max-width:480px){.kpis{grid-template-columns:minmax(0,1fr)}.kpi .v{font-size:23px}.top .ctl{margin-left:0;width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const $=s=>document.querySelector(s);
function fv(v,d){d=d||0;if(v==null||!isFinite(v))return '—';var s=Math.abs(v).toFixed(d),p=s.split('.'),i=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');return (v<0?'−':'')+(p.length>1?i+','+p[1]:i)}
const pct=(a,b,d=1)=>b?fv(a/b*100,d)+'%':'—';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tok=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function chart(id,cfg){const el=document.getElementById(id);if(!el)return;const c=new Chart(el,cfg);CH.push(c);return c}
function pal(){return {a:tok('--accent'),a2:tok('--accent-2'),ink:tok('--ink'),mu:tok('--muted'),line:tok('--line'),good:tok('--good'),warn:tok('--warn'),bad:tok('--bad'),soft:tok('--accent-soft'),cat:CFG.cat}}
function setChartDefaults(){const p=pal();Chart.defaults.color=p.mu;Chart.defaults.borderColor=p.line;Chart.defaults.font.family="'Public Sans',system-ui,sans-serif";Chart.defaults.font.size=11;Chart.defaults.animation=false;Chart.defaults.plugins.legend.labels.boxWidth=10;Chart.defaults.plugins.legend.labels.boxHeight=10;Chart.defaults.maintainAspectRatio=false;Chart.defaults.plugins.tooltip.backgroundColor=p.ink;Chart.defaults.plugins.tooltip.titleColor=tok('--bg');Chart.defaults.plugins.tooltip.bodyColor=tok('--bg')}
function alpha(hex,a){if(!hex)return hex;hex=hex.replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');const n=parseInt(hex,16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
const yNum={ticks:{callback:v=>fv(v)}};
function tip(t,f){return `<span class="tip" tabindex="0" aria-label="Definición">i<span class="bx">${t}${f?'<code>'+f+'</code>':''}</span></span>`}
function chip(cur,prev,goodUp,mode,suffix){if(prev==null||cur==null||!isFinite(prev))return '';let dlt,txt;if(mode==='pp'){dlt=cur-prev;txt=fv(Math.abs(dlt),1)+' pp'}else if(mode==='abs'){dlt=cur-prev;txt=fv(Math.abs(dlt))}else{if(!prev)return '';dlt=(cur/prev-1)*100;txt=fv(Math.abs(dlt),1)+'%'}
  if(Math.abs(dlt)<0.05)return '<span class="chip fl">▬ estable</span>';const up=dlt>0;return `<span class="chip ${up===goodUp?'up':'dn'}">${up?'▲':'▼'} ${txt}${suffix?' '+suffix:''}</span>`}
function kpi(o){return `<div class="kpi"><div class="lb">${o.l}${o.t?tip(o.t,o.f):''}${o.cmp?'<span class="cmp" title="KPI homologado: mismo cálculo en ambas compañías" aria-label="KPI homologado"></span>':''}</div>
 <div class="v">${o.v}${o.u?'<small>'+o.u+'</small>':''}</div><div class="row">${o.c||''}${o.s?'<span class="s">'+o.s+'</span>':''}</div>${o.sp?'<canvas id="'+o.sp+'"></canvas>':''}</div>`}
function spark(id,arr,color){chart(id,{type:'line',data:{labels:arr.map((_,i)=>i),datasets:[{data:arr,borderColor:color,backgroundColor:alpha(color,.12),fill:true,borderWidth:1.6,pointRadius:arr.map((_,i)=>i===arr.length-1?2.5:0),pointBackgroundColor:color,tension:.35}]},options:{plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{x:{display:false},y:{display:false}},events:[]}})}
function seg(name,opts,cur){return `<div class="seg" role="group">${opts.map(o=>`<button type="button" data-seg="${name}" data-v="${o[0]}" aria-pressed="${o[0]===cur}">${o[1]}</button>`).join('')}</div>`}
function sel(id,opts,cur,label){return `<div class="field"><label for="${id}">${label}</label><select id="${id}">${opts.map(o=>`<option value="${esc(o[0])}"${o[0]===cur?' selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`}
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}

let SUCSORT={k:'cc',d:-1};
function sucTable(){
  const cons=m(winRows(ST.win,'Consolidado').slice(-1)[0]);
  let rs=Object.keys(D.series).filter(s=>s!=='Consolidado').map(s=>{const x=m(winRows(ST.win,s).slice(-1)[0]);x.s=s;return x}).filter(x=>x.cc>0);
  rs.sort((a,b)=>SUCSORT.k==='s'?a.s.localeCompare(b.s)*SUCSORT.d*-1:((a[SUCSORT.k]||0)-(b[SUCSORT.k]||0))*SUCSORT.d);
  const mx=Math.max(...rs.map(x=>x.tu||0),cons.tu);
  const cols=[['s','Sucursal'],['va','VA'],['cc','Cuota cobrada'],['pdev','% dev.'],['exp','Expuestos'],['ppr','Prima/recibo'],['nrec','Reclamos'],['tu','Tasa de uso']];
  $('#suctab').innerHTML=`<table><thead><tr>${cols.map(c=>`<th class="sort ${c[0]==='s'?'':'num'}" data-sk="${c[0]}">${c[1]}${SUCSORT.k===c[0]?(SUCSORT.d<0?' ↓':' ↑'):''}</th>`).join('')}<th>Uso vs consolidado</th></tr></thead><tbody>
  ${rs.map(x=>{const lvl=x.exp<20?'':(x.tu>cons.tu*1.2?'high':x.tu<cons.tu*.8?'ok':'');return `<tr><td>${esc(x.s)}</td><td class="num">${fv(x.va)}</td><td class="num">${fv(x.cc)}</td><td class="num">${fv(x.pdev,1)}%</td><td class="num">${fv(x.exp,1)}</td><td class="num">${fv(x.ppr,2)}</td><td class="num">${fv(x.nrec)}</td><td class="num">${lvl?'<span class="pill '+lvl+'">'+fv(x.tu,1)+'%</span>':fv(x.tu,1)+'%'}</td>
   <td style="min-width:140px"><div class="bar" style="position:relative"><i style="width:${(x.tu||0)/mx*100}%;background:${lvl==='high'?'var(--bad)':'var(--accent)'}"></i><span style="position:absolute;top:-2px;bottom:-2px;left:${cons.tu/mx*100}%;width:2px;background:var(--ink)"></span></div></td></tr>`}).join('')}
  <tr><td><b>Consolidado</b></td><td class="num"><b>${fv(cons.va)}</b></td><td class="num"><b>${fv(cons.cc)}</b></td><td class="num">${fv(cons.pdev,1)}%</td><td class="num">${fv(cons.exp,1)}</td><td class="num">${fv(cons.ppr,2)}</td><td class="num">${fv(cons.nrec)}</td><td class="num"><b>${fv(cons.tu,1)}%</b></td><td></td></tr></tbody></table>`;
}

    const top3=vals.slice(0,3).reduce((a,b)=>a+b,0);$('#d-r').innerHTML=`Los tres primeros (${L.slice(0,3).map(esc).join(', ')}) concentran <b>${fv(top3/tot*100,1)}%</b> del total de ${fv(tot,dec)} ${unit}.`;}
  else{$('#d-tab').innerHTML=`<table><thead><tr><th>${g==='suc'?'Sucursal':'Tipo'}</th><th class="num">USD/recibo</th></tr></thead><tbody>${pairs.map(x=>`<tr><td>${esc(x[0])}</td><td class="num">${fv(x[1],2)}</td></tr>`).join('')}</tbody></table>`;$('#d-r').innerHTML='La prima por recibo refleja la tarifa media de cada segmento: los vehículos de carga pagan entre 2 y 4 veces lo de un particular, coherente con su mayor uso de grúa pesada.';}
  const ks=Object.keys(D.cc_suc_mes).sort((a,b)=>D.cc_suc_mes[b].reduce((x,y)=>x+y,0)-D.cc_suc_mes[a].reduce((x,y)=>x+y,0));
  chart('c-d2',{type:'bar',data:{labels:D.labels.hist,datasets:ks.map((k,i)=>({label:k,data:D.cc_suc_mes[k],backgroundColor:p.cat[i%p.cat.length]}))},options:{plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:c=>c.dataset.label+': '+fv(c.parsed.y)+' USD'}}},scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,...yNum}}}});
}

V.cobranza=function(){
  const K=D.cob.kpi,p0=pal();
  $('#main').innerHTML=`<section class="view"><div class="vhead"><div><h2>Cobranza</h2><p>Velocidad de cobro: días entre el inicio de vigencia del recibo y su fecha de cobro. El archivo contiene solo recibos cobrados, así que se mide el tiempo y no el saldo pendiente.</p></div></div>
   <div class="kpis">
    ${kpi({l:'Mediana de días de cobro',v:fv(K.mediana),u:'días',s:'promedio '+fv(K.media,1)+' días'})}
    ${kpi({l:'Cobrado en ≤ 30 días',v:fv(K.p30,1)+'%',s:'de '+fv(K.n)+' recibos'})}
    ${kpi({l:'Cobrado en ≤ 90 días',v:fv(K.p90,1)+'%',c:'<span class="chip up">Ágil</span>'})}
    ${kpi({l:'Cobrado por anticipado',v:fv(K.p_ant,1)+'%',s:'antes del inicio de vigencia'})}
   </div>
   <div class="grid2"><div class="panel"><div class="ph"><div><h3>Distribución del tiempo de cobro</h3><p>N° de recibos por tramo</p></div></div><div class="ch"><canvas id="c-cb1"></canvas></div></div>
   <div class="panel"><div class="ph"><div><h3>Mediana mensual de días de cobro</h3><p>Más estable que el promedio ante cobros tardíos aislados</p></div></div><div class="ch"><canvas id="c-cb2"></canvas></div></div></div>
   <p class="note">Julio 2026 sube a 20 días por un lote con vigencias retroactivas, no por un deterioro de la gestión. Agosto vuelve a 6 días.</p></section>`;
  const B=D.cob.buckets;chart('c-cb1',{type:'bar',data:{labels:B.map(b=>b[0]),datasets:[{data:B.map(b=>b[1]),backgroundColor:B.map((_,i)=>i>=4?alpha(p0.warn,.85):p0.a),borderRadius:3}]},options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fv(c.parsed.y)+' recibos ('+fv(B[c.dataIndex][2],1)+'%)'}}},scales:{y:yNum,x:{grid:{display:false}}}}});
  chart('c-cb2',{type:'line',data:{labels:D.labels.hist,datasets:[{data:D.cob.med,borderColor:p0.a2,backgroundColor:alpha(p0.a2,.12),fill:true,tension:.3,pointRadius:2,borderWidth:2}]},options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fv(c.parsed.y)+' días'}}},scales:{y:{beginAtZero:true},x:{grid:{display:false}}}}});
};

V.conciliacion=function(){
  ST.kv=ST.kv||'dim';const u=C.unidad,U=u.charAt(0).toUpperCase()+u.slice(1);
  const g=C.comunes/C.gc_total*100,b=C.comunes/C.brd_vig*100;
  const opts=[['dim','Por '+C.dim_label.toLowerCase()],['venc','Vencimientos próximos'],['rezago','Antigüedad de lo no cargado']];
  $('#main').innerHTML=`<section class="view"><div class="vhead"><div><h2>Conciliación de cartera</h2><p>Cartera en GC frente a bordereaux vigente al 31/08/2026. Unidad de análisis: ${CFG.unidadTxt}. Ambos cuadres de control cierran.</p></div></div>
   <div class="kpis">
    ${kpi({l:'Coincidencia de cartera',t:DEF.coinc[0],f:DEF.coinc[1],v:fv(g,1)+'%',c:`<span class="chip ${g>=90?'up':g>=80?'wr':'dn'}">${g>=90?'Sana':g>=80?'Vigilar':'Crítica'}</span>`,s:fv(C.comunes)+' de '+fv(C.gc_total)+' en GC',cmp:1})}
    ${kpi({l:'Por cargar en GC',t:'Vigentes en bordereaux que no figuran en la cartera GC.',v:fv(C.aus_cart),c:`<span class="chip ${C.aus_cart/C.brd_vig>0.15?'dn':'wr'}">${pct(C.aus_cart,C.brd_vig)} del vigente</span>`,s:'acción: cargar en GC',cmp:1})}
    ${kpi({l:'Bordereaux caduco',t:'En GC con vigencia, pero su último bordereaux ya venció.',v:fv(C.obs[0][1]),s:'acción: depurar o renovar'})}
    ${kpi({l:'Sin bordereaux',t:'En GC sin ningún bordereaux asociado.',v:fv(C.obs[1][1]),s:'acción: facturar o verificar'})}
   </div>
   <div class="panel"><div class="ph"><div><h3>Cuadre de las dos fuentes</h3><p>Cada barra suma su total de control</p></div></div>
    <div class="flow">
     <div class="fl"><span>Cartera GC<b>${fv(C.gc_total)}</b></span><div class="stack"><div style="flex:${C.comunes};background:var(--accent)">Coincidentes ${fv(C.comunes)}</div><div style="flex:${C.aus_brd};background:var(--warn)" title="Sin bordereaux vigente">${fv(C.aus_brd)}</div></div></div>
     <div class="fl"><span>Bordereaux vigente<b>${fv(C.brd_vig)}</b></span><div class="stack"><div style="flex:${C.comunes};background:var(--accent)">Coincidentes ${fv(C.comunes)}</div><div style="flex:${C.aus_cart};background:var(--bad)" title="Por cargar en GC">${fv(C.aus_cart)}</div></div></div>
     <div class="legend"><span><i style="background:var(--accent)"></i>Coincidentes</span><span><i style="background:var(--warn)"></i>En GC sin bordereaux vigente</span><span><i style="background:var(--bad)"></i>Vigente en bordereaux, por cargar en GC</span><span>Bordereaux vigente = vehículos activos al cierre ✔</span></div>
    </div></div>
   <div class="panel"><div class="ph"><div><h3 id="k-t"></h3><p id="k-s"></p></div><div class="tools">${sel('kvsel',opts,ST.kv,'Ver')}</div></div><div class="ch" id="k-box"><canvas id="c-k"></canvas></div><p class="read" id="k-r"></p></div>
   <div class="panel"><div class="ph"><div><h3>Listado para gestión</h3><p>Registros que requieren acción. Busque, filtre y copie el resultado para su equipo.</p></div></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
     ${sel('tlist',[['ab','En GC sin bordereaux vigente ('+fv(C.aus_brd)+')'],['ac','Por cargar en GC ('+fv(C.aus_cart)+')']],TB.list,'Lista')}
     <span id="tobsw"></span>
     <div class="field"><label for="tq">Buscar</label><input type="search" id="tq" placeholder="${C.unidad==='placa'?'Placa, asegurado…':'Póliza, asegurado…'}" value="${esc(TB.q)}"></div>
     <button class="btn" id="tcopy" type="button" style="margin-left:auto">Copiar como CSV</button></div>
    <div class="tw" id="ttab"></div><div class="pager" id="tpag"></div><textarea id="tfall" hidden style="width:100%;height:120px;margin-top:8px"></textarea></div>
  </section>`;
  drawConc();drawTable();
};
function drawConc(){
  killCharts();const p=pal(),k=ST.kv,box=$('#k-box');box.style.height='';
  if(k==='dim'){const dm=C.dim.filter(x=>x[1]+x[2]+(x[3]||0)>0);const hasAC=dm.some(x=>x[3]!=null);
    $('#k-t').textContent='Estado de conciliación por '+C.dim_label.toLowerCase();$('#k-s').textContent=hasAC?'Coincidentes, en GC sin bordereaux y por cargar en GC':'Coincidentes y en GC sin bordereaux vigente (los pendientes de carga no traen '+C.dim_label.toLowerCase()+')';
    box.style.height=Math.max(260,dm.length*24+70)+'px';
    const ds=[{label:'Coincidentes',data:dm.map(x=>x[1]),backgroundColor:p.a},{label:'En GC sin bordereaux',data:dm.map(x=>x[2]),backgroundColor:p.warn}];if(hasAC)ds.push({label:'Por cargar en GC',data:dm.map(x=>x[3]),backgroundColor:p.bad});
    chart('c-k',{type:'bar',data:{labels:dm.map(x=>x[0]),datasets:ds},options:{indexAxis:'y',plugins:{legend:{position:'bottom'},tooltip:{callbacks:{afterBody:it=>{const x=dm[it[0].dataIndex];return 'Coincidencia: '+pct(x[1],x[1]+x[2])}}}},scales:{x:{stacked:true,...yNum},y:{stacked:true,grid:{display:false}}}}});
    const worst=dm.filter(x=>x[1]+x[2]>=30).map(x=>[x[0],x[1]/(x[1]+x[2])*100]).sort((a,b)=>a[1]-b[1]).slice(0,3);
    $('#k-r').innerHTML=`Menor coincidencia (con al menos 30 ${C.unidad}s): <b>${worst.map(x=>esc(x[0])+' '+fv(x[1],1)+'%').join(', ')}</b>. ${CFG.concDimNote||''}`;}
  else if(k==='venc'){$('#k-t').textContent='Vencimientos de la cartera coincidente';$('#k-s').textContent='N° de '+C.unidad+'s por mes de fin de bordereaux. En color, los próximos 90 días desde el corte.';
    const V2=C.venc;chart('c-k',{type:'bar',data:{labels:V2.labels,datasets:[{data:V2.vals,backgroundColor:V2.vals.map((_,i)=>i<3?p.a2:alpha(p.mu,.4)),borderRadius:3}]},options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fv(c.parsed.y)+' '+C.unidad+'s ('+pct(c.parsed.y,C.comunes)+')'}}},scales:{y:yNum,x:{grid:{display:false}}}}});
    const top=C.dim.slice().sort((a,b)=>b[4]-a[4]).slice(0,3);
    $('#k-r').innerHTML=`<b>${fv(ren90)} ${C.unidad}s (${pct(ren90,C.comunes)})</b> vencen entre septiembre y noviembre 2026. Por ${C.dim_label.toLowerCase()}, el mayor volumen está en ${top.map(x=>esc(x[0])+' ('+fv(x[4])+')').join(', ')}. Es la ventana donde se decide la persistencia del último trimestre.`;}
  else{$('#k-t').textContent='Antigüedad de lo pendiente de cargar en GC';$('#k-s').textContent='Por cargar en GC según mes de inicio del bordereaux';
    const R=C.rezago;chart('c-k',{type:'bar',data:{labels:R.map(x=>x[0]),datasets:[{data:R.map(x=>x[1]),backgroundColor:p.bad,borderRadius:3}]},options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fv(c.parsed.y)+' '+C.unidad+'s'}}},scales:{y:yNum,x:{grid:{display:false}}}}});
    $('#k-r').innerHTML=CFG.rezagoNote;}
}
let TB={list:'ab',q:'',obs:'',page:0,sk:null,sd:1};
function tRows(){const t=C['tab_'+TB.list];let r=t.rows;const q=TB.q.trim().toLowerCase();
  if(TB.list==='ab'&&TB.obs)r=r.filter(x=>x[x.length-1]===TB.obs);
  if(q)r=r.filter(x=>x.some(v=>String(v==null?'':v).toLowerCase().includes(q)));
  if(TB.sk!=null)r=r.slice().sort((a,b)=>String(a[TB.sk]??'').localeCompare(String(b[TB.sk]??''),'es',{numeric:true})*TB.sd);return r}
function dfmt(s){if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s))return s==null?'—':s;const[y,mo,d]=s.split('-');return d+'/'+mo+'/'+y}
function drawTable(){const t=C['tab_'+TB.list];$('#tobsw').innerHTML=TB.list==='ab'?sel('tobs',[['','Todas las observaciones']].concat(C.obs.map(o=>[o[0],o[0]])),TB.obs,'Filtro'):'';
  const r=tRows(),ps=25,pages=Math.max(1,Math.ceil(r.length/ps));TB.page=Math.min(TB.page,pages-1);const sl=r.slice(TB.page*ps,TB.page*ps+ps);
  $('#ttab').innerHTML=`<table><thead><tr>${t.cols.map((c,i)=>`<th class="sort" data-tk="${i}">${c}${TB.sk===i?(TB.sd>0?' ↑':' ↓'):''}</th>`).join('')}</tr></thead><tbody>${sl.map(x=>`<tr>${x.map((v,i)=>{if(i===x.length-1&&TB.list==='ab'){return `<td><span class="pill ${/caduco/.test(v)?'med':'high'}">${/caduco/.test(v)?'Depurar / renovar':'Facturar / verificar'}</span></td>`}return `<td>${esc(/^\d{4}-\d{2}-\d{2}$/.test(v||'')?dfmt(v):(v==null?'—':v))}</td>`}).join('')}</tr>`).join('')||`<tr><td colspan="${t.cols.length}" style="color:var(--muted)">Ningún registro coincide con la búsqueda.</td></tr>`}</tbody></table>`;
  $('#tpag').innerHTML=`<span>${fv(r.length)} registros · página ${TB.page+1} de ${pages}</span><button type="button" data-pg="-1" ${TB.page===0?'disabled':''}>Anterior</button><button type="button" data-pg="1" ${TB.page>=pages-1?'disabled':''}>Siguiente</button>`;}

V.ficha=function(){
  const rows=[['Vehículos activos (VA)',DEF.va],['Cuota cobrada',DEF.cc],['Cuota devengada',DEF.dev],['% devengado',DEF.pdev],['Expuestos',DEF.exp],['Prima devengada por expuesto',DEF.ppe],['Tasa de uso',DEF.tu],['Prima por recibo',DEF.ppr],['Reclamos por 1.000 VA',DEF.f1000],['Persistencia',DEF.pers],['Coincidencia de cartera',DEF.coinc],['Renovaciones en 90 días',DEF.ren]];
  $('#main').innerHTML=`<section class="view"><div class="vhead"><div><h2>Ficha técnica de indicadores</h2><p>Los indicadores marcados como <span class="cmpk"><span class="cmp"></span>KPI homologado</span> se calculan igual en los tableros de Estar Seguros y Seguros Venezuela, de modo que pueden compararse entre compañías y contra un mismo estándar.</p></div></div>
  <div class="panel def"><dl>${rows.map(r=>`<dt>${r[0]}</dt><dd>${r[1][0]} <code>${r[1][1]}</code></dd>`).join('')}</dl></div>
  <div class="grid2"><div class="panel"><h3>Criterios de comparación</h3><p class="read">La ventana de <b>últimos 12 meses</b> es la referencia comparable: ambas carteras tienen al menos 12 meses completos, mientras el histórico depende de la fecha de arranque (${D.inicio} en esta compañía). Las frecuencias se expresan por 1.000 vehículos o por 100 expuestos para aislar el tamaño de cartera. La conciliación usa como unidad ${CFG.unidadTxt}; los porcentajes son comparables, los conteos no.</p></div>
  <div class="panel"><h3>Fuentes</h3><p class="read">Bordereaux de cuotas cobradas y reclamaciones hasta agosto 2026, elaborados por GoCast como prestador del servicio de asistencia vial. Conciliación de cartera vigente al 31/08/2026 contra el archivo GC <b>${CFG.gcFile}</b>. Los dos últimos meses de cartera y persistencia son provisionales por carga tardía de renovaciones.</p></div></div></section>`;
};

/* ---------- navegación ---------- */
function nav(){const side=$('#side'),ns=$('#navsel');side.innerHTML=CFG.nav.map(gr=>`<h6>${gr[0]}</h6>`+gr[1].map(v=>`<button type="button" data-view="${v}"${v===ST.view?' aria-current="page"':''}>${CFG.navName[v].replace(/^./,c=>c.toUpperCase())}${CFG.navCount&&CFG.navCount[v]?'<span class="n">'+CFG.navCount[v]+'</span>':''}</button>`).join('')).join('')+`<p class="foot">Corte 31/08/2026<br>${D.meses_op} meses de operación<br>Servicio prestado por GoCast</p>`;
  ns.innerHTML=CFG.nav.map(gr=>`<optgroup label="${gr[0]}">${gr[1].map(v=>`<option value="${v}"${v===ST.view?' selected':''}>${CFG.navName[v].replace(/^./,c=>c.toUpperCase())}</option>`).join('')}</optgroup>`).join('')}
const ALLOWED=CFG.nav.flatMap(g=>g[1]);
function go(v,push){if(!V[v]||!ALLOWED.includes(v))v='resumen';ST.view=v;killCharts();setChartDefaults();V[v]();nav();if(push!==false){try{history.replaceState(null,'','#'+v)}catch(e){}}window.scrollTo({top:0})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-view],[data-go],[data-seg],[data-sk],[data-tk],[data-pg],#tcopy');if(!b)return;
  if(b.dataset.view||b.dataset.go)return go(b.dataset.view||b.dataset.go);
  if(b.dataset.seg){const s=b.dataset.seg,v=b.dataset.v;if(s==='dd'){ST.dd=v;go('distribucion',false)}if(s==='compby'){COMP.by=v;drawCart()}if(s==='comppct'){COMP.pct=v==='pct';drawCart()}return}
  if(b.dataset.sk){const k=b.dataset.sk;SUCSORT={k,d:SUCSORT.k===k?-SUCSORT.d:-1};sucTable();return}
  if(b.dataset.tk!=null){const k=+b.dataset.tk;TB.sd=TB.sk===k?-TB.sd:1;TB.sk=k;drawTable();return}
  if(b.dataset.pg){TB.page+=+b.dataset.pg;drawTable();return}
  if(b.id==='tcopy'){const t=C['tab_'+TB.list],r=tRows();const csv=[t.cols].concat(r).map(x=>x.map(v=>{v=v==null?'':String(v);return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(';')).join('\n');
    const fb=()=>{const ta=$('#tfall');ta.hidden=false;ta.value=csv;ta.focus();ta.select();toast('Texto seleccionado: use Copiar del sistema')};
    try{navigator.clipboard.writeText(csv).then(()=>toast(fv(r.length)+' registros copiados'),fb)}catch(err){fb()}}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='navsel')return go(t.value);
  if(t.id==='winsel'){ST.win=t.value;try{localStorage.setItem('dash-win',t.value)}catch(er){}return go(ST.view,false)}
  if(t.id==='sucsel'){ST.suc=t.value;return go('resultados',false)}
  if(t.id==='rvsel'){ST.rv=t.value;return drawRec()}
  if(t.id==='cvsel'){ST.cv=t.value;const bx=$('#cv-box');bx.style.display='';bx.style.height='';return drawCart()}
  if(t.id==='vssel'){ST.vs=t.value;return drawCart()}
  if(t.id==='dmsel'){ST.dm=t.value;return drawDist()}
  if(t.id==='kvsel'){ST.kv=t.value;return drawConc()}
  if(t.id==='tlist'){TB.list=t.value;TB.page=0;TB.sk=null;TB.obs='';$('#tfall').hidden=true;return drawTable()}
  if(t.id==='tobs'){TB.obs=t.value;TB.page=0;return drawTable()}
});
function placeTip(e){const t=e.target.closest&&e.target.closest('.tip');if(!t)return;const bx=t.querySelector('.bx');bx.style.left='-10px';requestAnimationFrame(()=>{const r=bx.getBoundingClientRect(),W=document.documentElement.clientWidth;if(r.right>W-8)bx.style.left=(-10-(r.right-W+12))+'px';if(r.left<8)bx.style.left=(parseFloat(bx.style.left)+(8-r.left))+'px'})}
document.addEventListener('pointerover',placeTip);document.addEventListener('focusin',placeTip);
document.addEventListener('input',e=>{if(e.target.id==='tq'){TB.q=e.target.value;TB.page=0;drawTable()}});
// rehacer gráficos al cambiar de tema
const rerender=()=>go(ST.view,false);
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',rerender)}catch(e){}
new MutationObserver(rerender).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
$('#winsel').value=ST.win;
const h=(location.hash||'').slice(1);go(h,false);
</script>
